name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node --test
      - name: Manifest sanity
        run: node -e "const p=require('./package.json'); if (!p.dsh?.bundle?.patch) throw new Error('missing bundle patch'); if (!p.files.includes('index.js')) throw new Error('index.js not packed')"
